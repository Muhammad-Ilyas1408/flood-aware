[project]
name = "flood-aware"
version = "0.1.0"
description = "AI-powered Flood Decision Support System for the Swat River Basin"
readme = "README.md"

authors = [
    { name = "Muhammad Ilyas" }
]

license = "MIT"

keywords = [
    "ai",
    "llm",
    "langgraph",
    "fastapi",
    "streamlit",
    "gis",
    "flood",
    "rag",
    "disaster-management",
]

requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.9",
    "openai>=2.47.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
